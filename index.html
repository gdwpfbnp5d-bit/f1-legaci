<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07080b">
<title>F1 Legacy Mobile</title>
<style>
:root{--bg:#07080b;--card:#11141a;--card2:#181c23;--line:#292e38;--txt:#f6f7f8;--muted:#9299a6;--red:#e10600;--green:#39d98a;--gold:#f4c84a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;overscroll-behavior:none}
button,input,select{font:inherit}button{border:0;color:#fff;background:var(--red);font-weight:800;border-radius:13px;padding:13px 15px}button:active{transform:scale(.98)}button.secondary{background:var(--card2);border:1px solid var(--line)}
.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#0a0b0f,#07080b)}
.top{position:sticky;top:0;z-index:20;background:#090a0eee;backdrop-filter:blur(18px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.topline{display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:950}.logo span{color:var(--red)}.season{text-align:right;font-size:11px;color:var(--muted)}
main{padding:14px 14px calc(92px + env(safe-area-inset-bottom))}
.hero{border-radius:20px;padding:20px;background:linear-gradient(145deg,#1b1e25,#0e1015);border:1px solid var(--line);overflow:hidden;position:relative}
.hero:after{content:"";position:absolute;right:-60px;top:-50px;width:180px;height:180px;border-radius:50%;background:#e1060015}.tag{font-size:10px;font-weight:900;letter-spacing:.7px;background:#272b34;padding:6px 9px;border-radius:99px}.hero h1{font-size:34px;line-height:1;margin:13px 0 5px}.muted{color:var(--muted)}.tiny{font-size:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin-top:12px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-title h2{font-size:17px;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:16px}.stat{background:#191c23;border-radius:11px;padding:10px}.stat span{font-size:10px;color:var(--muted)}.stat b{display:block;font-size:19px;margin-top:2px}.progress{height:5px;background:#292e37;border-radius:99px;overflow:hidden;margin-top:7px}.progress i{display:block;height:100%;background:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{width:100%;min-height:58px;text-align:left;background:var(--card2);border:1px solid var(--line)}.action strong{display:block}.action small{color:var(--muted);font-weight:500}
.event{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.event:last-child{border-bottom:0}.event .ico{width:34px;height:34px;border-radius:10px;background:#22262f;display:grid;place-items:center;flex:none}
.bottom{position:fixed;z-index:25;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#0d0f14ee;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.navbtn{background:transparent;color:var(--muted);padding:7px 2px;font-size:10px;border-radius:10px}.navbtn.active{background:#20242c;color:#fff}.navbtn .ni{display:block;font-size:18px;margin-bottom:2px}
.screen{min-height:65vh}.race-card{background:linear-gradient(145deg,#151922,#0d1015);border:1px solid var(--line);border-radius:19px;padding:18px}.circuit{height:100px;border-radius:14px;background:radial-gradient(ellipse at center,#242a34,#101218);display:grid;place-items:center;font-size:42px;margin:10px 0}.choice{width:100%;text-align:left;margin:5px 0;background:var(--card2);border:1px solid var(--line)}.choice .sub{font-size:11px;color:var(--muted);font-weight:500}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:10px 5px;border-bottom:1px solid var(--line);text-align:left}th{font-size:9px;color:var(--muted);text-transform:uppercase}.me{font-weight:900;color:#fff;background:#1d2028}
.modal{position:fixed;z-index:50;inset:0;background:#000c;display:none;align-items:flex-end}.sheet{width:min(520px,100%);max-height:86vh;overflow:auto;background:#12151b;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px}.sheet h2{margin-top:0}.sheet .row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.form{display:grid;gap:10px}input,select{width:100%;background:#090b0f;border:1px solid var(--line);border-radius:11px;color:#fff;padding:13px}
.toast{position:fixed;z-index:60;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#08090b;padding:10px 14px;border-radius:99px;font-weight:800;font-size:12px;display:none;box-shadow:0 10px 30px #0008}
@media(min-width:700px){body{padding:15px}.app{border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 30px 80px #0008}.top{position:relative}}
/* F1 LEGACY - animations & ambiance */
.hero,
.card,
.race-card,
.action,
.choice{
  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;
}

.hero:hover,
.card:hover,
.race-card:hover{
  transform:translateY(-2px);
  border-color:#e1060055;
  box-shadow:0 12px 35px #0006;
}

.action:active,
.choice:active,
.navbtn:active{
  transform:scale(.97);
}

.hero:after{
  animation:heroGlow 5s ease-in-out infinite;
}

@keyframes heroGlow{
  0%,100%{
    transform:scale(1);
    opacity:.5;
  }
  50%{
    transform:scale(1.18);
    opacity:1;
  }
}

@keyframes racePulse{
  0%,100%{
    box-shadow:0 0 0 rgba(225,6,0,0);
  }
  50%{
    box-shadow:0 0 25px rgba(225,6,0,.12);
  }
}

.race-card{
  animation:racePulse 4s ease-in-out infinite;
}

.progress i{
  animation:progressIn .9s ease-out;
}

@keyframes progressIn{
  from{
    width:0;
  }
/* F1 RACING BACKGROUND */
.app{
  position:relative;
  overflow:hidden;
}

.app:before{
  content:"";
  position:fixed;
  z-index:0;
  left:50%;
  top:0;
  width:100%;
  max-width:520px;
  height:100vh;
  transform:translateX(-50%);
  pointer-events:none;
  background:
    linear-gradient(
      180deg,
      rgba(225,6,0,.08) 0%,
      transparent 30%,
      rgba(255,255,255,.02) 70%,
      rgba(225,6,0,.06) 100%
    );
}

main,
.top,
.bottom{
  position:relative;
}

main{
  z-index:2;
}

.top{
  z-index:20;
}

.bottom{
  z-index:25;
}

.racing-bg{
  position:fixed;
  z-index:3;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}

.racing-track{
  position:absolute;
  left:50%;
  top:0;
  width:min(520px,100%);
  height:100%;
  transform:translateX(-50%);
  background:
    repeating-linear-gradient(
      0deg,
      transparent 0 38px,
      rgba(255,255,255,.035) 39px 40px
    ),
    linear-gradient(
      90deg,
      transparent 0 14%,
      #151820 15% 85%,
      transparent 86%
    );
  opacity:.65;
}

.racing-track:before{
  content:"";
  position:absolute;
  left:18%;
  right:18%;
  top:0;
  bottom:0;
  border-left:2px solid rgba(255,255,255,.06);
  border-right:2px solid rgba(255,255,255,.06);
}

.f1-car{
  position:absolute;
  left:-100px;
  width:80px;
  height:28px;
  animation:carDrive linear infinite;
}

.f1-car:before{
  content:"";
  position:absolute;
  left:10px;
  top:8px;
  width:55px;
  height:12px;
  border-radius:8px 12px 5px 5px;
  background:var(--red);
  box-shadow:
    0 0 14px rgba(225,6,0,.5),
    0 10px 15px rgba(0,0,0,.7);
}

.f1-car:after{
  content:"";
  position:absolute;
  left:0;
  top:6px;
  width:80px;
  height:3px;
  background:#fff;
  box-shadow:
    0 18px 0 #fff,
    0 0 12px rgba(255,255,255,.4);
}

.car1{
  top:28%;
  animation-duration:5s;
}

.car2{
  top:47%;
  animation-duration:7s;
  animation-delay:-2s;
  transform:scale(.72);
  opacity:.7;
}

.car3{
  top:66%;
  animation-duration:6s;
  animation-delay:-4s;
  transform:scale(.55);
  opacity:.45;
}

@keyframes carDrive{
  from{
    left:-110px;
  }
  to{
    left:calc(100% + 110px);
  }
/* CAREER MODE - VIDEO GAME UI */

.career-screen{
  animation:careerIn .5s ease-out;
}

@keyframes careerIn{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.career-banner{
  position:relative;
  overflow:hidden;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  padding:20px;
  border-radius:20px;
  background:
    linear-gradient(135deg,#e10600 0%,#8b0502 42%,#11141a 100%);
  box-shadow:0 15px 45px rgba(225,6,0,.18);
}

.career-banner:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-70px;
  top:-80px;
  border-radius:50%;
  border:25px solid rgba(255,255,255,.08);
}

.career-label{
  font-size:9px;
  font-weight:950;
  letter-spacing:2px;
  color:#fff9;
}

.career-banner h2{
  margin:5px 0 3px;
  font-size:25px;
  letter-spacing:-1px;
}

.career-banner p{
  margin:0;
  font-size:11px;
  color:#fff9;
  font-weight:700;
}

.career-age{
  position:relative;
  z-index:2;
  font-size:48px;
  line-height:.8;
  font-weight:950;
  text-align:center;
}

.career-age small{
  display:block;
  margin-top:8px;
  font-size:9px;
  letter-spacing:2px;
}

.career-card{
  position:relative;
  overflow:hidden;
}

.career-card .section-title{
  position:relative;
  z-index:2;
}

.career-track{
  display:flex;
  justify-content:space-between;
  position:relative;
  padding:8px 2px 4px;
}

.career-track:before{
  content:"";
  position:absolute;
  left:7%;
  right:7%;
  top:21px;
  height:3px;
  background:#292e38;
}

.career-step{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
  width:20%;
}

.career-step span{
  font-size:8px;
  color:var(--muted);
  font-weight:800;
}

.career-dot{
  width:28px;
  height:28px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#1b1f27;
  border:2px solid #303540;
  font-size:10px;
  font-weight:900;
}

.career-step.done .career-dot{
  background:var(--red);
  border-color:var(--red);
  color:#fff;
}

.career-step.active .career-dot{
  background:#fff;
  color:#111;
  border-color:#fff;
  box-shadow:0 0 0 5px rgba(225,6,0,.25),0 0 25px rgba(225,6,0,.5);
  animation:careerPulse 1.8s infinite;
}

.career-step.active span{
  color:#fff;
}

@keyframes careerPulse{
  50%{
    transform:scale(1.08);
  }
}

.trophy-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.trophy{
  padding:13px 8px;
  text-align:center;
  border-radius:13px;
  background:#191c23;
  border:1px solid rgba(255,255,255,.04);
}

.trophy b{
  display:block;
  font-size:22px;
}

.trophy span{
  display:block;
  margin-top:3px;
  font-size:9px;
  color:var(--muted);
  font-weight:700;
}

.big-progress{
  height:9px;
  background:#242932;
  border-radius:99px;
  overflow:hidden;
}

.big-progress i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#e10600,#ff514b);
  border-radius:99px;
  box-shadow:0 0 14px rgba(225,6,0,.5);
  animation:progressIn .9s ease-out;
}

.rep-text{
  margin-top:8px;
  font-size:10px;
  color:var(--muted);
}

.career-action{
  position:relative;
  min-height:105px;
  overflow:hidden;
}

.career-action:after{
  content:"";
  position:absolute;
  width:70px;
  height:70px;
  right:-25px;
  bottom:-30px;
  border-radius:50%;
  background:rgba(225,6,0,.08);
}

.big-icon{
  display:block;
  font-size:25px;
  margin-bottom:6px;
}

.career-info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.career-info div{
  padding:11px;
  border-radius:12px;
  background:#191c23;
}

.career-info span{
  display:block;
  color:var(--muted);
  font-size:9px;
}

.career-info b{
  display:block;
  margin-top:3px;
  font-size:12px;
}

.career-market{
  width:100%;
  margin-top:10px;
}

.career-event{
  background:
    linear-gradient(135deg,#171a21,#101217);
}

.event-glow{
  position:absolute;
  width:100px;
  height:100px;
  right:-50px;
  top:-50px;
  border-radius:50%;
  background:rgba(225,6,0,.15);
  filter:blur(15px);
}

.live-dot{
  color:#ff514b;
  font-size:9px;
  animation:livePulse 1.5s infinite;
}

@keyframes livePulse{
  50%{
    opacity:.35;
  }
}

.career-news{
  display:flex;
  gap:12px;
  align-items:flex-start;
}

.news-icon{
  width:42px;
  height:42px;
  flex:none;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:#242832;
  font-size:20px;
}

.career-news b{
  font-size:13px;
}

.career-news p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}}}</style>
</head>
<body>
<div class="app">
  <div class="racing-bg">
  <div class="racing-track"></div>
  <div class="f1-car car1"></div>
  <div class="f1-car car2"></div>
  <div class="f1-car car3"></div>
</div>
<header class="top"><div class="topline"><div class="logo">F1 <span>LEGACY</span></div><div class="season" id="season"></div></div></header>
<main id="main"></main>
<nav class="bottom" id="nav"></nav>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>

<script>
const tracks=[["Bahreïn","🇧🇭"],["Arabie Saoudite","🇸🇦"],["Australie","🇦🇺"],["Japon","🇯🇵"],["Chine","🇨🇳"],["Miami","🇺🇸"],["Imola","🇮🇹"],["Monaco","🇲🇨"],["Espagne","🇪🇸"],["Canada","🇨🇦"],["Autriche","🇦🇹"],["Silverstone","🇬🇧"],["Spa","🇧🇪"],["Budapest","🇭🇺"],["Zandvoort","🇳🇱"],["Monza","🇮🇹"],["Bakou","🇦🇿"],["Singapour","🇸🇬"],["Austin","🇺🇸"],["Mexico","🇲🇽"],["São Paulo","🇧🇷"],["Las Vegas","🇺🇸"],["Qatar","🇶🇦"],["Abu Dhabi","🇦🇪"]];
const teams={Ferrari:91,McLaren:94,"Red Bull Racing":93,Mercedes:89,"Aston Martin":83,Alpine:79,Williams:76,Haas:74,Audi:78,Cadillac:75};
let g=JSON.parse(localStorage.getItem("F1LegacyMobile")||"null"),tab="home",race={};
  const juniorTracks=[
  ["Lyon","🇫🇷"],
  ["Le Mans","🇫🇷"],
  ["Milan","🇮🇹"],
  ["Barcelone","🇪🇸"],
  ["Monaco","🇲🇨"],
  ["Bruxelles","🇧🇪"],
  ["Londres","🇬🇧"],
  ["Berlin","🇩🇪"],
  ["Madrid","🇪🇸"],
  ["Abu Dhabi","🇦🇪"]
];

const $=x=>document.getElementById(x), save=()=>{localStorage.setItem("F1LegacyMobile",JSON.stringify(g));render()}, clamp=x=>Math.max(1,Math.min(99,Math.round(x))), money=x=>"€"+Math.round(x).toLocaleString("fr-FR");
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",1800)}
function modal(h){$("sheet").innerHTML=h;$("modal").style.display="flex"}function closeModal(){$("modal").style.display="none"}
function restart(){if(confirm("Supprimer cette carrière ?")){localStorage.removeItem("F1LegacyMobile");g=null;render()}}
function create(){g={name:$("name").value.trim()||"Pilote Legacy",country:$("country").value,age:8,year:2026,stage:"Karting",team:"Karting",academy:"Aucune",money:5000,rep:8,pace:48,race:43,fitness:42,consistency:40,wet:35,focus:45,wins:0,podiums:0,poles:0,races:0,titles:0,points:0,round:0,seasonPts:0,contract:0,carDev:0,history:["Carrière créée : premier jour en karting."],retired:false};save()}
function render(){if(!g){$("season").textContent="MODE CARRIÈRE";$("nav").style.display="none";$("main").innerHTML=`<div class="card hero" style="margin-top:45px"><span class="tag">F1 LEGACY MOBILE</span><h1>Construis ta légende.</h1><p class="muted">Commence à 8 ans. Fais tes choix. Atteins la F1. Gagne des titres. Décide quand prendre ta retraite.</p><div class="form"><input id="name" placeholder="Nom du pilote"><select id="country"><option>🇫🇷 France</option><option>🇲🇨 Monaco</option><option>🇮🇹 Italie</option><option>🇬🇧 Royaume-Uni</option><option>🇪🇸 Espagne</option><option>🇧🇷 Brésil</option><option>🇩🇪 Allemagne</option><option>🇯🇵 Japon</option><option>🇺🇸 États-Unis</option></select><button onclick="create()">Créer mon pilote 🏁</button></div></div>`;return}
$("season").innerHTML=`${g.year}<br><b>${g.stage}</b>`;$("nav").style.display="grid";$("nav").innerHTML=[["home","⌂","Accueil"],["career","◉","Pilote"],["gp","🏁","GP"],["standings","☷","Classement"],["legacy","★","Profil"]].map(x=>`<button class="navbtn ${tab===x[0]?"active":""}" onclick="tab='${x[0]}';render()"><span class="ni">${x[1]}</span>${x[2]}</button>`).join("");({home,career,gp,standings,legacy}[tab])()}
function head(){return `<section class="hero"><span class="tag">${g.stage.toUpperCase()} · ${g.age} ANS</span><h1>${g.name}</h1><div class="muted">${g.country} · ${g.team}</div><div class="stats">${[["Vitesse",g.pace],["Course",g.race],["Physique",g.fitness],["Régularité",g.consistency],["Pluie",g.wet],["Mental",g.focus]].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b><div class="progress"><i style="width:${x[1]}%"></i></div></div>`).join("")}</div></section>`}
function home(){$("main").innerHTML=`<div class="screen">${head()}<div class="card"><div class="section-title"><h2>Ta prochaine étape</h2><span class="tag">${g.stage==="F1"?`${g.round}/24 GP`:"CARRIÈRE"}</span></div>${g.stage==="F1"?`<p>Prochain Grand Prix : <b>${tracks[g.round]?.[1]} ${tracks[g.round]?.[0]}</b></p>`:`<p>Tu es en <b>${g.stage}</b>. Continue à progresser pour franchir l'étape suivante.</p>`}<button style="width:100%" onclick="continueCareer()">Continuer →</button></div><div class="card"><div class="section-title"><h2>Dernières nouvelles</h2></div>${g.history.slice(-4).reverse().map(x=>`<div class="event"><div class="ico">🏎️</div><div>${x}</div></div>`).join("")}</div></div>`}
function career(){
  const nextStage={
    "Karting":"F4",
    "F4":"F3",
    "F3":"F2",
    "F2":"F1",
    "F1":"Champion du Monde"
  };

  const stageOrder=["Karting","F4","F3","F2","F1"];
  const currentIndex=stageOrder.indexOf(g.stage);
  const progress=currentIndex<0?0:Math.round((currentIndex/(stageOrder.length-1))*100);

  $("main").innerHTML=`
  <div class="screen career-screen">


    <div class="career-banner">
      <div>
        <span class="career-label">MODE CARRIÈRE</span>
        <h2>TON ASCENSION</h2>
        <p>${g.stage} → ${nextStage[g.stage]||"LÉGENDE"}</p>
      </div>
      <div class="career-age">${g.age}<small>ANS</small></div>
    </div>

    <div class="card career-card">
      <div class="section-title">
        <h2>🏁 Progression</h2>
        <b>${progress}%</b>
      </div>

      <div class="career-track">
        ${stageOrder.map((stage,i)=>{
          const done=i<currentIndex;
          const active=i===currentIndex;
          return `
            <div class="career-step ${done?"done":""} ${active?"active":""}">
              <div class="career-dot">${done?"✓":i+1}</div>
              <span>${stage}</span>
            </div>
          `;
        }).join("")}
      </div>
    </div>

    <div class="card career-card">
      <div class="section-title">
        <h2>🏆 Palmarès</h2>
        <span class="muted">${g.seasonPts} pts cette saison</span>
      </div>

      <div class="trophy-grid">
        <div class="trophy"><b>${g.races}</b><span>Courses</span></div>
        <div class="trophy"><b>${g.wins}</b><span>Victoires</span></div>
        <div class="trophy"><b>${g.podiums}</b><span>Podiums</span></div>
        <div class="trophy"><b>${g.poles}</b><span>Poles</span></div>
        <div class="trophy"><b>${g.points}</b><span>Points</span></div>
        <div class="trophy"><b>${g.titles}</b><span>Titres</span></div>
      </div>
    </div>

    <div class="card career-card">
      <div class="section-title">
        <h2>📈 Réputation</h2>
        <b>${g.rep}/100</b>
      </div>

      <div class="big-progress">
        <i style="width:${Math.min(g.rep,100)}%"></i>
      </div>

      <div class="rep-text">
        ${
          g.rep<25
          ?"Jeune talent à surveiller"
          :g.rep<50
          ?"Un pilote qui commence à faire parler de lui"
          :g.rep<75
          ?"Une vraie valeur montante"
          :"Une superstar du paddock"
        }
      </div>
    </div>

    <div class="card career-card">
      <div class="section-title">
        <h2>🎯 Développement</h2>
        <span class="muted">Améliore ton pilote</span>
      </div>

      <div class="grid2">

        <button class="action career-action" onclick="train('pace')">
          <span class="big-icon">⚡</span>
          <strong>Simulateur</strong>
          <small>+ vitesse / course</small>
        </button>

        <button class="action career-action" onclick="train('fitness')">
          <span class="big-icon">💪</span>
          <strong>Physique</strong>
          <small>+ physique / régularité</small>
        </button>

        <button class="action career-action" onclick="train('wet')">
          <span class="big-icon">🌧️</span>
          <strong>Pluie</strong>
          <small>+ pluie / mental</small>
        </button>

        <button class="action career-action" onclick="train('mind')">
          <span class="big-icon">🧠</span>
          <strong>Mental</strong>
          <small>+ concentration</small>
        </button>

      </div>
    </div>

    <div class="card career-card">
      <div class="section-title">
        <h2>💼 Vie professionnelle</h2>
      </div>

      <div class="career-info">
        <div>
          <span>Équipe</span>
          <b>${g.team}</b>
        </div>

        <div>
          <span>Académie</span>
          <b>${g.academy}</b>
        </div>

        <div>
          <span>Contrat</span>
          <b>${g.contract?g.contract+" saison(s)":"Libre"}</b>
        </div>

        <div>
          <span>Budget</span>
          <b>${money(g.money)}</b>
        </div>
      </div>

      <button
        class="secondary career-market"
        onclick="market()">
        🏢 Ouvrir le marché des pilotes
      </button>
    </div>

    <div class="card career-card career-event">
      <div class="event-glow"></div>

      <div class="section-title">
        <h2>🔥 Actualité</h2>
        <span class="live-dot">● LIVE</span>
      </div>

      <div class="career-news">
        <div class="news-icon">🏎️</div>
        <div>
          <b>Ta carrière commence maintenant.</b>
          <p>
            Chaque course, chaque décision et chaque résultat
            peut changer ton avenir.
          </p>
        </div>
      </div>
    </div>

  </div>`;
}
function train(x){if(x==="pace"){g.pace+=2;g.race+=2}if(x==="fitness"){g.fitness+=3;g.consistency+=2}if(x==="wet"){g.wet+=3;g.focus+=1}if(x==="mind"){g.focus+=3;g.consistency+=2}["pace","race","fitness","consistency","wet","focus"].forEach(k=>g[k]=clamp(g[k]));g.history.push("Entraînement terminé : progression du pilote.");save();toast("Progression enregistrée")}
function continueCareer(){if(g.stage==="F1"){tab="gp";render();return}if(g.stage==="Karting"&&g.age>=14)return path("F4",["F4 nationale","F4 européenne","Encore du karting"]);if(g.stage==="F4"&&g.age>=16)return path("F3",["F3 avec académie","F3 indépendante"]);if(g.stage==="F3"&&g.age>=18)return path("F2",["Signer en F2","Encore une saison F3"]);if(g.stage==="F2"&&g.age>=20)return path("F1",Object.keys(teams).slice(0,6));g.age++;g.year++;g.pace=clamp(g.pace+1);g.race=clamp(g.race+1);g.history.push(`Saison ${g.year} : progression en ${g.stage}.`);save()}
function path(type,opts){modal(`<h2>${type==="F1"?"Ton premier contrat F1":`Passage en ${type}`}</h2>${opts.map((o,i)=>`<div class="row"><b>${o}</b><button onclick="pick('${type}',${i})">Choisir</button></div>`).join("")}`)}
function pick(type,i){closeModal();if(type==="F4"){g.stage="F4";g.pace+=5;g.race+=4;g.rep+=7;g.money+=10000}if(type==="F3"){g.stage="F3";g.pace+=6;g.race+=6;g.rep+=9;g.money+=25000}if(type==="F2"){g.stage="F2";g.pace+=7;g.race+=7;g.rep+=12;g.money+=50000}if(type==="F1"){g.stage="F1";g.team=Object.keys(teams)[i];g.academy="Programme F1";g.contract=2;g.rep+=20;g.pace+=6;g.race+=6;g.fitness+=4;g.history.push(`CONTRAT F1 : ${g.team} te donne ta chance au plus haut niveau.`)}g.age++;g.year++;save()}
function gp(){if(g.stage!=="F1"){tab="career";render();return}if(g.round>=24){seasonEnd();return}const c=tracks[g.round];const weather=Math.random()<.23?"pluie":Math.random()<.18?"variable":"sec";race={weather,strategy:"balanced",tyres:"medium",grid:0};$("main").innerHTML=`<div class="screen"><div class="race-card"><span class="tag">ROUND ${g.round+1}/24 · ${g.year}</span><h1>${c[1]} ${c[0]}</h1><div class="circuit">${weather==="pluie"?"🌧️":"🏁"}</div><p class="muted">La météo annonce une course <b>${weather}</b>. Choisis ton approche.</p><div class="grid2"><button class="choice" onclick="qual('attack')">🔥 <b>Agressive</b><div class="sub">Rythme élevé, risque élevé</div></button><button class="choice" onclick="qual('balanced')">⚖️ <b>Équilibrée</b><div class="sub">Polyvalente</div></button><button class="choice" onclick="qual('safe')">🛡️ <b>Prudente</b><div class="sub">Protège les pneus</div></button><button class="choice" onclick="qual('wet')">🌧️ <b>Spéciale pluie</b><div class="sub">Maximise ton avantage</div></button></div></div></div>`}
function qual(s){race.strategy=s;let car=(teams[g.team]||80)+g.carDev;let score=g.pace*.5+g.consistency*.2+g.focus*.1+car*.25+(race.weather==="pluie"?g.wet*.18:0)+Math.random()*16-8+(s==="attack"?4:s==="safe"?-2:0);race.grid=Math.max(1,Math.min(20,Math.round(12-(score-70)/3)));if(race.grid===1)g.poles++;modal(`<h2>Qualifications</h2><div class="circuit">P${race.grid}</div><p>${race.grid<=3?"🔥 Première ligne !":"Il faudra dépasser en course."}</p><button style="width:100%" onclick="tyres()">Choisir les pneus →</button>`)}
function tyres(){modal(`<h2>Stratégie pneus</h2><button class="choice" onclick="startRace('soft')">🔴 <b>Tendres</b><div class="sub">Maximum de rythme</div></button><button class="choice" onclick="startRace('medium')">🟡 <b>Mediums</b><div class="sub">Équilibre</div></button><button class="choice" onclick="startRace('hard')">⚪ <b>Durs</b><div class="sub">Longévité</div></button><button class="choice" onclick="startRace('inter')">🟢 <b>Intermédiaires</b><div class="sub">Pour la pluie</div></button>`)}
let racePhase=0,raceScore=0,racePhases=[];
function startRace(t){
 race.tyres=t;closeModal();racePhase=0;raceScore=0;
 racePhases=["Départ","Premiers tours","Arrêt aux stands","Milieu de course","Derniers tours"];
 renderRacePhase();
}
function raceNext(){
 racePhase++;
 if(racePhase>=racePhases.length){finish(raceScore);return}
 renderRacePhase();
}
function renderRacePhase(){
 let base=g.pace*.3+g.race*.28+g.consistency*.15+g.fitness*.08+g.focus*.06+((teams[g.team]||80)+g.carDev)*.25;
 let b=race.strategy==="attack"?5:race.strategy==="safe"?-3:2;
 if(race.tyres==="soft")b+=2;if(race.tyres==="hard")b-=1;
 if(race.tyres==="inter")b+=race.weather==="pluie"?7:-6;
 if(race.weather==="pluie")b+=(g.wet-50)*.15;
 raceScore+=base+b+Math.random()*18-9;
 $("main").innerHTML=`<div class="screen"><div class="race-card"><span class="tag">${racePhases[racePhase].toUpperCase()}</span><h1>${tracks[g.round][1]} ${tracks[g.round][0]}</h1><div class="lights">${[1,2,3,4,5].map(n=>`<i class="light ${n<=racePhase+1?"on":""}"></i>`).join("")}</div><div class="radio">INGÉNIEUR : "${racePhase===0?"Excellent départ.":racePhase===2?"Arrêt propre, tu ressors dans le trafic.":"Le rythme est bon. Continue comme ça."}"</div><button style="width:100%;margin-top:14px" onclick="raceNext()">${racePhase===racePhases.length-1?"Voir le résultat →":"Continuer →"}</button></div></div>`;
}
function finish(score){let pos=Math.max(1,Math.min(20,Math.round(12-(score-72)/3))),pts=[25,18,15,12,10,8,6,4,2,1][pos-1]||0,c=tracks[g.round];g.round++;g.races++;g.seasonPts+=pts;g.points+=pts;if(pos===1){g.wins++;g.rep=clamp(g.rep+4)}else if(pos<=3){g.podiums++;g.rep=clamp(g.rep+2)}g.history.push(`GP ${c[0]} : P${pos} · +${pts} points.`);save();modal(`<h2>${c[1]} ${c[0]} 🏁</h2><div class="stats"><div class="stat"><span>Résultat</span><b>P${pos}</b></div><div class="stat"><span>Points</span><b>+${pts}</b></div><div class="stat"><span>Championnat</span><b>${g.seasonPts}</b></div></div><p>${pos===1?"🏆 VICTOIRE !":pos<=3?"🥂 PODIUM !":"Course terminée."}</p><button style="width:100%" onclick="closeModal();tab='standings';render()">Voir le classement</button>`)}
function standings(){let arr=[{n:g.name,t:g.team,p:g.seasonPts},{n:"Enzo Ricci",t:"Ferrari",p:g.round*11+20},{n:"Noah Bennett",t:"McLaren",p:g.round*10+15},{n:"Hugo Martin",t:"Mercedes",p:g.round*8+10},{n:"Leo Rossi",t:"Red Bull Racing",p:g.round*7}].sort((a,b)=>b.p-a.p);$("main").innerHTML=`<div class="screen">${head()}<div class="card"><div class="section-title"><h2>🏆 Pilotes</h2><span class="tag">${g.seasonPts} PTS</span></div><table><tr><th>#</th><th>Pilote</th><th>Équipe</th><th>Pts</th></tr>${arr.map((x,i)=>`<tr class="${x.n===g.name?"me":""}"><td>${i+1}</td><td>${x.n}</td><td>${x.t}</td><td><b>${x.p}</b></td></tr>`).join("")}</table></div></div>`}
function market(){$("main").innerHTML=`<div class="screen">${head()}<div class="card"><h2>📑 Marché des transferts</h2>${Object.entries(teams).map(([t,v])=>`<div class="row"><div><b>${t}</b><div class="tiny muted">Voiture ${v}/100 · contrat 2 ans</div></div><button onclick="sign('${t}')">Signer</button></div>`).join("")}</div></div>`}
function sign(t){g.team=t;g.contract=2;g.money+=g.rep*5000;g.history.push(`Transfert : signature avec ${t}.`);save();toast("Contrat signé")}
function legacy(){$("main").innerHTML=`<div class="screen">${head()}<div class="stats"><div class="stat"><span>Titres</span><b>${g.titles}</b></div><div class="stat"><span>Victoires</span><b>${g.wins}</b></div><div class="stat"><span>Podiums</span><b>${g.podiums}</b></div><div class="stat"><span>Poles</span><b>${g.poles}</b></div><div class="stat"><span>Courses</span><b>${g.races}</b></div><div class="stat"><span>Points</span><b>${g.points}</b></div></div><div class="card"><h2>📜 Ton histoire</h2>${g.history.slice().reverse().map(x=>`<div class="event"><div class="ico">🏆</div><div>${x}</div></div>`).join("")}</div><div class="card"><h2>⚙️ Gestion de carrière</h2><p class="muted">Tu veux repartir de zéro ?</p><button class="secondary" style="width:100%;margin-top:10px" onclick="restart()">🔄 Nouvelle carrière</button></div></div>`}
function seasonEnd(){modal(`<h2>Fin de saison ${g.year}</h2><h1>${g.seasonPts} points</h1><p>${g.seasonPts>260?"🏆 CHAMPION DU MONDE !":"Saison terminée."}</p><button style="width:100%" onclick="nextSeason()">Commencer la saison suivante</button>`)}
function nextSeason(){closeModal();if(g.seasonPts>260)g.titles++;g.year++;g.age++;g.round=0;g.seasonPts=0;g.carDev=0;g.contract=Math.max(0,g.contract-1);g.history.push(`Saison ${g.year} : nouveau chapitre à ${g.age} ans.`);if(g.age>=35)g.stage="Légende";save()}
render();
</script>
</body>
</html>
